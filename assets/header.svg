<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Nguyen Phuong Duy - Fullstack Web Developer</title>
  <desc id="desc">A navy banner with blue and teal waves. Based in Ho Chi Minh City, Vietnam.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101826"/>
